services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: verifica-diarios-app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${PORT:?Variavel PORT obrigatoria no .env}:${PORT:?Variavel PORT obrigatoria no .env}"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    environment:
      - TZ=${TZ:-America/Campo_Grande}
      - APP_ENV=prod
      - PORT=${PORT:?Variavel PORT obrigatoria no .env}
      - STREAMLIT_SERVER_PORT=${PORT:?Variavel PORT obrigatoria no .env}
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - STREAMLIT_SERVER_ENABLE_STATIC_SERVING=true

networks:
  default:
    name: homelab_network
    external: true
